name: Database migrations

on:
  push:
    paths:
      - "alembic/**"
      - "alembic.ini"
      - "api/**"
      - "app.py"
      - "db/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/database-migrations.yml"
  pull_request:
    paths:
      - "alembic/**"
      - "alembic.ini"
      - "api/**"
      - "app.py"
      - "db/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/database-migrations.yml"

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./salesgenie_ci.db
      - run: alembic check
        env:
          DATABASE_URL: sqlite:///./salesgenie_ci.db
      - run: python -m pytest db/tests -q
      - run: alembic downgrade base
        env:
          DATABASE_URL: sqlite:///./salesgenie_ci.db

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salesgenie_dev
          POSTGRES_USER: salesgenie
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salesgenie -d salesgenie_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://salesgenie:ci-only-password@localhost:5432/salesgenie_dev
      - run: alembic check
        env:
          DATABASE_URL: postgresql+psycopg://salesgenie:ci-only-password@localhost:5432/salesgenie_dev
      - run: python -m pytest db/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://salesgenie:ci-only-password@localhost:5432/salesgenie_dev
      - run: alembic downgrade base
        env:
          DATABASE_URL: postgresql+psycopg://salesgenie:ci-only-password@localhost:5432/salesgenie_dev
