services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salesgenie_dev}
      POSTGRES_USER: ${POSTGRES_USER:-salesgenie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - salesgenie-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salesgenie} -d ${POSTGRES_DB:-salesgenie_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  salesgenie-postgres-data:
